<div class="p-4 form-container">
  <div *ngIf="loading" class="flex justify-center items-center py-8">
    <i class="pi pi-spin pi-spinner text-3xl text-primary"></i>
  </div>

  <form
    *ngIf="!loading"
    [formGroup]="projectForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4"
  >
    <!-- Nombre del Proyecto -->
    <div class="field">
      <label
        for="name"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Nombre del Proyecto
      </label>
      <input
        pInputText
        id="name"
        formControlName="name"
        class="w-full px-3 py-2 bg-white dark:bg-[#1A1616] rounded-lg text-gray-700 dark:text-[#D4D4D4] focus:outline-none font-medium border border-gray-200 dark:border-primary/10 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
        placeholder="Ingresa el nombre del proyecto"
      />
      <small
        *ngIf="
          projectForm.get('name')?.invalid && projectForm.get('name')?.touched
        "
        class="text-red-500"
      >
        El nombre es requerido y debe tener al menos 3 caracteres
      </small>
    </div>

    <!-- Descripción -->
    <div class="field">
      <label
        for="description"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Descripción
      </label>
      <textarea
        pInputTextarea
        id="description"
        formControlName="description"
        class="w-full px-3 py-2 bg-white dark:bg-[#1A1616] rounded-lg text-gray-700 dark:text-[#D4D4D4] focus:outline-none font-medium border border-gray-200 dark:border-primary/10 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
        [rows]="3"
        placeholder="Describe tu proyecto"
      ></textarea>
      <small
        *ngIf="
          projectForm.get('description')?.invalid &&
          projectForm.get('description')?.touched
        "
        class="text-red-500"
      >
        La descripción es requerida y debe tener al menos 10 caracteres
      </small>
    </div>

    <!-- Estado del Proyecto -->
    <div class="field">
      <label
        for="status"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Estado del Proyecto
      </label>
      <p-select
        id="status"
        formControlName="status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona un estado"
        [style]="{ width: '100%' }"
        styleClass="w-full font-semibold"
      ></p-select>
      <small
        *ngIf="
          projectForm.get('status')?.invalid &&
          projectForm.get('status')?.touched
        "
        class="text-red-500"
      >
        El estado es requerido
      </small>
    </div>

    <!-- Imagen del Proyecto -->
    <div class="field">
      <label
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Imagen del Proyecto
      </label>
      <div class="flex items-center space-x-4">
        <div
          class="w-24 h-24 rounded-lg overflow-hidden border-2 border-gray-200 dark:border-gray-700 flex items-center justify-center bg-gray-100 dark:bg-gray-800"
        >
          <img
            *ngIf="selectedImage"
            [src]="selectedImage.file?.url"
            alt="Imagen del proyecto"
            class="w-full h-full object-cover"
          />
          <i
            *ngIf="!selectedImage"
            class="pi pi-image text-3xl text-gray-400"
          ></i>
        </div>
        <button
          type="button"
          pButton
          label="Cambiar imagen"
          icon="pi pi-images"
          (click)="openImageSelector()"
          class="p-button-outlined"
        ></button>
      </div>
      <small
        *ngIf="
          projectForm.get('imageUrl')?.invalid &&
          projectForm.get('imageUrl')?.touched
        "
        class="text-red-500"
      >
        La imagen es requerida
      </small>
    </div>

    <!-- Fecha de finalización -->
    <div class="field">
      <label
        for="dueDate"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >
        Fecha de Finalización
      </label>
      <p-date-picker
        id="dueDate"
        formControlName="dueDate"
        [showIcon]="true"
        dateFormat="dd/mm/yy"
        [minDate]="minDate"
        [style]="{ width: '100%' }"
        [inputStyleClass]="
          'w-full px-3 py-2 bg-white dark:bg-[#1A1616] rounded-lg text-gray-700 dark:text-[#D4D4D4] focus:outline-none font-medium border border-gray-200 dark:border-primary/10 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all'
        "
        placeholder="Seleccionar fecha"
        [readonlyInput]="true"
      />
      <small
        *ngIf="
          projectForm.get('dueDate')?.invalid &&
          projectForm.get('dueDate')?.touched
        "
        class="text-red-500"
      >
        La fecha de finalización es requerida
      </small>
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <p-button
        type="button"
        (click)="close()"
        label="Cancelar"
        styleClass="p-button-text"
      ></p-button>
      <p-button
        type="submit"
        label="Guardar Cambios"
        [disabled]="!projectForm.valid || loading"
      ></p-button>
    </div>
  </form>
</div>

<!-- Image selector dialog -->
<p-dialog
  [(visible)]="showImageSelector"
  header="Seleccionar Imagen"
  [modal]="true"
  [breakpoints]="{ '960px': '75vw', '640px': '80vw' }"
  [style]="{ width: '40vw' }"
  [draggable]="false"
  [transitionOptions]="'400ms cubic-bezier(0.25, 0.8, 0.25, 1)'"
  styleClass="p-dialog-custom p-dialog-slide-right"
  [maskStyleClass]="'bg-black/60'"
  [transitionOptions]="'450ms cubic-bezier(0.25, 0.8, 0.25, 1)'"
>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 p-4">
    <div
      *ngFor="let image of availableImages"
      class="aspect-video rounded-lg overflow-hidden cursor-pointer hover:opacity-90 transition-opacity border-2"
      [class.border-primary]="selectedImage?.id === image.id"
      [class.border-gray-200]="selectedImage?.id !== image.id"
      (click)="selectImage(image)"
    >
      <img
        [src]="image.file?.url"
        alt="Project image option"
        class="w-full h-full object-cover"
      />
    </div>
  </div>
</p-dialog>
