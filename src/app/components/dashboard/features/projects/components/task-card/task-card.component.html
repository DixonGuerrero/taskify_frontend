<div
  class="bg-white dark:bg-[#1A1616] p-3 rounded-lg shadow-sm border border-gray-100 dark:border-gray-800 mb-2 cursor-move group"
  pDraggable="tasks"
  (onDragStart)="dragStart(task)"
  (onDragEnd)="dragEnd()"
  (click)="showDetails(task)"
  [style.animation-delay]="index * 0.1 + 's'"
  @scaleIn
>
  <div class="flex justify-between items-start gap-2">
    <span class="font-medium text-gray-800 dark:text-gray-200 flex-1 min-w-0">{{
      task.name
    }}</span>

    <!-- Mobile menu button - visible only on touch devices/small screens -->
    <div class="flex items-center gap-1">
      <p-overlayPanel #op [style]="{ minWidth: '160px' }">
        <div class="flex flex-col gap-1">
          <button
            pButton
            type="button"
            class="p-button-text p-button-sm justify-start text-left"
            [class.p-button-secondary]="task.status === TaskStatus.PENDING"
            [class.text-primary]="task.status !== TaskStatus.PENDING"
            [disabled]="task.status === TaskStatus.PENDING"
            (click)="changeStatus(TaskStatus.PENDING, op)"
          >
            <i class="pi pi-clock mr-2"></i>
            Pendiente
          </button>
          <button
            pButton
            type="button"
            class="p-button-text p-button-sm justify-start text-left"
            [class.p-button-secondary]="task.status === TaskStatus.IN_PROGRESS"
            [class.text-blue-500]="task.status !== TaskStatus.IN_PROGRESS"
            [disabled]="task.status === TaskStatus.IN_PROGRESS"
            (click)="changeStatus(TaskStatus.IN_PROGRESS, op)"
          >
            <i class="pi pi-sync mr-2"></i>
            En Proceso
          </button>
          <button
            pButton
            type="button"
            class="p-button-text p-button-sm justify-start text-left"
            [class.p-button-secondary]="task.status === TaskStatus.COMPLETED"
            [class.text-green-500]="task.status !== TaskStatus.COMPLETED"
            [disabled]="task.status === TaskStatus.COMPLETED"
            (click)="changeStatus(TaskStatus.COMPLETED, op)"
          >
            <i class="pi pi-check-circle mr-2"></i>
            Terminado
          </button>
        </div>
      </p-overlayPanel>
      <button
        pButton
        type="button"
        icon="pi pi-ellipsis-v"
        class="p-button-text p-button-sm md:opacity-0 md:group-hover:opacity-100 opacity-100 transition-opacity flex-shrink-0"
        (click)="$event.stopPropagation(); op.toggle($event)"
      ></button>

      <span
        [ngClass]="getPriorityClass(task.priority)"
        class="text-xs px-2 py-1 rounded-full flex-shrink-0"
      >
        {{ getPriorityText(task.priority) }}
      </span>
    </div>
  </div>
</div>
