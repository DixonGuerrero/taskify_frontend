<div *ngIf="task" class="p-4 space-y-4 bg-white dark:bg-gray-800 rounded-lg">
  <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-100">{{ task.name }}</h3>

  <p *ngIf="task.description" class="text-gray-600 dark:text-gray-300">{{ task.description }}</p>
  <p *ngIf="!task.description" class="text-gray-500 dark:text-gray-400 italic">Sin descripción.</p>

  <p-divider></p-divider>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
    <div>
      <span class="font-medium text-gray-500 dark:text-gray-400 block mb-1">Fecha Límite:</span>
      <span class="text-gray-700 dark:text-gray-200">{{ task.due_date | date:'EEEE, d \'de\' MMMM \'de\' y':'':'es-ES' }}</span>
    </div>
    <div>
      <span class="font-medium text-gray-500 dark:text-gray-400 block mb-1">Prioridad:</span>
      <p-tag [value]="getPriorityText(task.priority)" [severity]="getPriorityClass(task.priority)"></p-tag>
    </div>
    <div *ngIf="task.project">
      <span class="font-medium text-gray-500 dark:text-gray-400 block mb-1">Proyecto:</span>
      <span class="text-gray-700 dark:text-gray-200">{{ task.project.name }}</span>
    </div>
     
  </div>

  <p-divider></p-divider>

  <div class="flex justify-end space-x-2 mt-4">
     <button pButton type="button" label="Cerrar" icon="pi pi-times" class="p-button-text" (click)="dialogRef.close()"></button>
    <button pButton
            *ngIf="task.project?.id"
            label="Ir al Proyecto"
            icon="pi pi-arrow-right"
            class="p-button-primary"
            (click)="goToProject()">
    </button>
  </div>
</div>
<div *ngIf="!task" class="p-4 text-center text-gray-500 dark:text-gray-400">
  No se pudo cargar la información de la tarea.
</div>
