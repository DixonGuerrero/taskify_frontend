<div class="p-4 md:p-6">
  <div class="mb-6">
    <h1
      class="text-2xl font-bold text-gray-800 dark:text-white mb-2 flex items-center gap-3"
    >
      <i class="pi pi-sliders-h text-primary"></i>
      Configuración
    </h1>
    <p class="text-gray-600 dark:text-gray-300">
      Personaliza tu experiencia en Taskify

  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    <!-- Menú lateral -->
    <div class="lg:col-span-1">
      <div
        class="bg-white dark:bg-[#1A1616] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden"
      >
        <ul class="divide-y divide-gray-200 dark:divide-gray-800">
          <li>
            <button
              (click)="activeSection = 'appearance'"
              class="w-full px-4 py-3 flex items-center text-left"
              [ngClass]="{
                'bg-primary/5 border-l-4 border-primary':
                  activeSection === 'appearance',
              }"
            >
              <i class="pi pi-palette mr-3 text-primary"></i>
              <span class="font-medium">Apariencia</span>
            </button>
          </li>

    <!-- Contenido principal -->
    <div class="lg:col-span-3">
      <div
        class="bg-white dark:bg-[#1A1616] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 p-6"
      >
        <!-- Sección de Apariencia -->
        <div *ngIf="activeSection === 'appearance'">
          <h2 class="text-xl font-bold mb-4">Apariencia</h2>

          <!-- Tema -->
          <!-- Dentro de la sección de Apariencia -->
          <div class="mb-6">
            <h3 class="text-lg font-semibold mb-3">Tema</h3>
            <div class="flex flex-wrap gap-4">
              <div
                class="theme-option cursor-pointer p-4 border rounded-lg flex flex-col items-center"
                [ngClass]="{ 'border-primary': settings.theme === 'light' }"
                (click)="updateTheme('light')"
              >
                <div
                  class="w-20 h-12 bg-white border border-gray-200 rounded-md mb-2"
                ></div>
                <span>Claro</span>
              </div>

              <div
                class="theme-option cursor-pointer p-4 border rounded-lg flex flex-col items-center"
                [ngClass]="{ 'border-primary': settings.theme === 'dark' }"
                (click)="updateTheme('dark')"
              >
                <div
                  class="w-20 h-12 bg-gray-900 border border-gray-700 rounded-md mb-2"
                ></div>
                <span>Oscuro</span>
              </div>

              <div
                class="theme-option cursor-pointer p-4 border rounded-lg flex flex-col items-center"
                [ngClass]="{ 'border-primary': settings.theme === 'system' }"
                (click)="updateTheme('system')"
              >
                <div
                  class="w-20 h-12 bg-gradient-to-r from-white to-gray-900 border border-gray-300 rounded-md mb-2"
                ></div>
                <span>Sistema</span>
              </div>
            </div>
          </div>
