<div class="p-4 md:p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
      Mi Perfil
    </h1>
    <p class="text-gray-600 dark:text-gray-300">
      Administra tu información personal
    </p>
  </div>

  <!-- Indicador de carga -->
  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 lg:grid-cols-4 gap-6">
    <!-- Tarjeta de perfil -->
    <div class="lg:col-span-1">
      <div
        class="bg-white dark:bg-[#1A1616] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 p-6 flex flex-col items-center"
      >
        <div class="relative mb-4">
          <img
            [src]="getCurrentAvatarUrl()"
            alt="Foto de perfil"
            class="w-32 h-32 rounded-full object-cover border-4 border-white dark:border-gray-800 shadow-md"
          />
          <p-button
            *ngIf="editMode"
            icon="pi pi-camera"
            styleClass="p-button-rounded p-button-sm absolute bottom-0 right-0 bg-primary"
            (click)="openAvatarDialog()"
          ></p-button>
        </div>

        <h2 class="text-xl font-bold text-gray-800 dark:text-white">
          {{ currentUser.first_name }} {{ currentUser.last_name }}
        </h2>
        <p class="text-gray-500 dark:text-gray-400 mb-4">
          {{ currentUser.email }}
        </p>

        <div class="flex justify-center w-full">
          <p-button
            [label]="editMode ? 'Guardar cambios' : 'Editar perfil'"
            [icon]="editMode ? 'pi pi-check' : 'pi pi-pencil'"
            styleClass="w-full"
            (click)="toggleEditMode()"
          ></p-button>
        </div>
      </div>
    </div>

    <!-- Información personal -->
    <div class="lg:col-span-3">
      <div
        class="bg-white dark:bg-[#1A1616] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 p-6"
      >
        <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">
          Información Personal
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Nombre -->
          <div class="mb-4">
            <label
              for="first_name"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Nombre</label
            >
            <input
              id="first_name"
              type="text"
              pInputText
              [(ngModel)]="currentUser.first_name"
              [disabled]="!editMode"
              class="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
            />
          </div>

          <!-- Apellido -->
          <div class="mb-4">
            <label
              for="last_name"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Apellido</label
            >
            <input
              id="last_name"
              type="text"
              pInputText
              [(ngModel)]="currentUser.last_name"
              [disabled]="!editMode"
              class="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
            />
          </div>

          <!-- Email -->
          <div class="mb-4">
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Correo electrónico</label
            >
            <input
              id="email"
              type="email"
              pInputText
              [(ngModel)]="currentUser.email"
              [disabled]="!editMode"
              class="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
            />
          </div>

          <!-- Teléfono -->
          <div class="mb-4">
            <label
              for="phone"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Teléfono</label
            >
            <input
              id="phone"
              type="phone"
              pInputText
              [(ngModel)]="currentUser.phone"
              [disabled]="!editMode"
              class="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
            />
          </div>
        </div>

        <p-divider></p-divider>

        <!-- Seguridad -->
        <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">
          Seguridad
        </h3>

        <div class="mb-4">
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Contraseña</label
          >
          <div class="flex items-center">
            <input
              id="password"
              type="password"
              pInputText
              value="********"
              disabled
              class="w-full"
            />
            <p-button
              icon="pi pi-key"
              styleClass="ml-2"
              (click)="openPasswordDialog()"
              [disabled]="!editMode"
            ></p-button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Diálogo para cambiar contraseña -->
  <p-dialog
    header="Cambiar contraseña"
    [(visible)]="showPasswordDialog"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="password-dialog"
    [breakpoints]="{ '960px': '75vw', '640px': '80vw' }"
    [style]="{ width: '40vw' }"
  >
    <div class="mb-4">
      <label
        for="newPassword"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
        >Nueva contraseña</label
      >
      <p-password
        id="newPassword"
        [(ngModel)]="newPassword"
        [toggleMask]="true"
        styleClass="w-full dark-mode-input"
        inputStyleClass="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
        [feedback]="true"
      ></p-password>
    </div>

    <div class="mb-4">
      <label
        for="confirmPassword"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
        >Confirmar contraseña</label
      >
      <p-password
        id="confirmPassword"
        [(ngModel)]="confirmPassword"
        [toggleMask]="true"
        styleClass="w-full dark-mode-input"
        inputStyleClass="w-full dark:bg-[#1A1616] dark:text-white dark:border-gray-700"
      ></p-password>
    </div>

    <div class="flex flex-col sm:flex-row justify-end gap-2 mt-4">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        styleClass="w-full sm:w-auto bg-surface-500 mb-2 sm:mb-0"
        (click)="cancelPasswordChange()"
      ></p-button>
      <p-button
        label="Cambiar contraseña"
        icon="pi pi-check"
        styleClass="w-full sm:w-auto"
        (click)="changePassword()"
      ></p-button>
    </div>
  </p-dialog>

  <!-- Diálogo para seleccionar avatar -->
  <p-dialog
    header="Seleccionar avatar"
    [(visible)]="showAvatarDialog"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [breakpoints]="{ '960px': '75vw', '640px': '80vw' }"
    [style]="{ width: '40vw' }"
    [transitionOptions]="'450ms cubic-bezier(0.34, 1.56, 0.64, 1)'"
    styleClass="p-dialog-custom p-dialog-zoom"
    maskStyleClass="bg-black/60"
  >
    <div class="grid grid-cols-2 gap-4">
      <div
        *ngFor="let image of userImages"
        class="cursor-pointer p-2 border rounded-lg flex justify-center"
        [ngClass]="{ 'border-primary': currentUser.image.id === image.id }"
        (click)="selectAvatar(image.id!)"
      >
        <img
          [src]="image.file?.url"
          [alt]="'Avatar ' + image.id"
          class="w-16 h-16 rounded-full object-cover"
        />
      </div>
    </div>

    <div class="flex justify-end mt-4">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        styleClass="bg-surface-500"
        (click)="showAvatarDialog = false"
      ></p-button>
    </div>
  </p-dialog>
</div>
