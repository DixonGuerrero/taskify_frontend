<!-- Spinner de verificación de sesión -->
<div
  *ngIf="checkingAuth"
  class="flex flex-col justify-center items-center min-h-screen"
>
  <p-progressSpinner
    styleClass="w-12 h-12"
    strokeWidth="4"
    animationDuration=".5s"
  ></p-progressSpinner>
  <p class="mt-4 text-primary font-medium">Verificando sesión...</p>
</div>

<!-- Formulario -->
<div *ngIf="!checkingAuth">
  <main
    class="w-screen min-h-screen flex flex-col items-center justify-center p-4"
  >
    <p-toast></p-toast>
    <div
      class="w-full max-w-sm bg-white dark:bg-[#1A1616] p-8 rounded-3xl border border-gray-100 dark:border-primary/10 shadow-lg dark:shadow-primary/5"
    >
      <!-- Título -->
      <h1
        class="text-4xl font-extrabold font-[Raleway] text-center mb-8 text-primary tracking-tighter"
      >
        Login
      </h1>

      <!-- Formulario -->
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="space-y-6"
        [ngClass]="{ 'opacity-50 pointer-events-none': loading || submitted }"
      >
        <!-- Usuario -->
        <div class="space-y-2">
          <label
            class="block text-sm font-bold text-gray-700 dark:text-[#D4D4D4]"
          >
            Usuario
          </label>
          <input
            type="text"
            formControlName="username"
            class="w-full px-3 py-2 rounded-lg text-gray-700 dark:text-[#D4D4D4] focus:outline-none font-medium border border-gray-200 dark:border-primary/10 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
            placeholder="Ingrese su usuario"
            [ngClass]="{
              'bg-red-50 dark:bg-red-900/20':
                (submitted || f['username'].touched) && f['username'].errors,
            }"
          />
          <small
            *ngIf="
              (submitted || f['username'].touched) &&
              f['username'].errors?.['required']
            "
            class="text-red-500 dark:text-red-400 text-xs"
          >
            Usuario requerido
          </small>
        </div>

        <!-- Contraseña -->
        <div class="space-y-2">
          <label
            class="block text-sm font-bold text-gray-700 dark:text-[#D4D4D4]"
          >
            Contraseña
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="w-full px-3 py-2 rounded-lg text-gray-700 dark:text-[#D4D4D4] focus:outline-none font-medium pr-10 border border-gray-200 dark:border-primary/10 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
              placeholder="Ingrese su contraseña"
              [ngClass]="{
                'bg-red-50 dark:bg-red-900/20':
                  (submitted || f['password'].touched) && f['password'].errors,
              }"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 dark:text-[#D4D4D4] hover:text-primary transition-colors"
            >
              <i
                class="pi"
                [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
              ></i>
            </button>
          </div>
          <small
            *ngIf="
              (submitted || f['password'].touched) &&
              f['password'].errors?.['required']
            "
            class="text-red-500 dark:text-red-400 text-xs"
          >
            Contraseña requerida
          </small>
        </div>

        <!-- Botón Login -->
        <p-button
          type="submit"
          [disabled]="loading || submitted || !loginForm.valid"
          [loading]="loading"
          label="Login"
          styleClass="w-full mb-3 bg-primary text-white rounded-lg py-2 hover:bg-primary-600 transition-all font-bold shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98]"
        />

        <!-- Divider OAuth -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div
              class="w-full border-t border-gray-200 dark:border-primary/20"
            ></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span
              class="px-2 bg-white dark:bg-[#1A1616] text-gray-500 dark:text-[#D4D4D4]"
              >o</span
            >
          </div>
        </div>

        <!-- Botón Google OAuth2 -->
        <a
          [href]="googleOAuthUrl"
          class="w-full flex items-center justify-center gap-2 px-4 py-2 border border-gray-200 dark:border-primary/20 rounded-lg bg-white dark:bg-[#2A2626] text-gray-700 dark:text-[#D4D4D4] font-medium hover:bg-gray-50 dark:hover:bg-primary/10 transition-all shadow-sm"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Ingresar con Google
        </a>

        <!-- Enlace de Registro -->
        <div class="text-center text-sm font-medium">
          <span class="text-gray-700 dark:text-[#D4D4D4]">
            No tienes cuenta?
          </span>
          <a
            routerLink="/auth/register"
            class="text-primary hover:underline font-bold"
          >
            Registrarme
          </a>
        </div>
      </form>
    </div>
  </main>
</div>
